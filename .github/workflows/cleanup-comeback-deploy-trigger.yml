name: Cleanup comeback deploy trigger

on: [push]

permissions: write-all

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Cleanup
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/deploy-comeback-trigger.txt
          git rm .github/workflows/cleanup-comeback-deploy-trigger.yml
          git commit -m "chore: remove comeback deploy helpers"
          git push
