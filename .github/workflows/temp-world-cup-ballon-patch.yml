name: Temporary World Cup Ballon patch

on:
  push:
    branches:
      - fix/world-cup-ballon-no-europe-gate

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/world-cup-ballon-no-europe-gate
      - name: Remove Europe gate from World Cup Ballon surge
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('app/components/career/CareerGame.tsx')
          text = path.read_text()
          replacements = [
              (
                  'const worldCupBallonSurge = Boolean(playsInEurope && (resolvedWorldCupStats?.goals ?? 0) >= 8);',
                  'const worldCupBallonSurge = Boolean((resolvedWorldCupStats?.goals ?? 0) >= 8);',
              ),
              (
                  '{isEuropeanClub(currentClub) && seasonWorldCupRecord.tournamentStats.goals >= 8 && (',
                  '{seasonWorldCupRecord.tournamentStats.goals >= 8 && (',
              ),
              (
                  'Oito ou mais gols na Copa, jogando na Europa, colocaram seu nome no centro da disputa pela Bola de Ouro.',
                  'Oito ou mais gols na Copa colocaram seu nome no centro da disputa pela Bola de Ouro.',
              ),
          ]
          for old, new in replacements:
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f'expected one occurrence, found {count}: {old}')
              text = text.replace(old, new, 1)
          path.write_text(text)
          PY
      - name: Commit patch
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/components/career/CareerGame.tsx
          git commit -m "fix: allow World Cup Ballon surge outside Europe"
          git push origin HEAD:fix/world-cup-ballon-no-europe-gate
