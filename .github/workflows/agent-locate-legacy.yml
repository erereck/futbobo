name: Locate legacy integration points

on:
  push:
    branches: [agent/futbobo-prestige-legacy-records]

permissions:
  contents: write

jobs:
  locate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/futbobo-prestige-legacy-records
          fetch-depth: 0
      - shell: bash
        run: |
          grep -n -C 8 -E 'calculateLegacyScore|legacyTier\(game\.legacyPoints\)|legacyPoints' app/components/career/CareerGame.tsx > .agent-prestige-locations.txt || true
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .agent-prestige-locations.txt
          git commit -m "chore: capture legacy integration locations" || exit 0
          git push origin HEAD:agent/futbobo-prestige-legacy-records
