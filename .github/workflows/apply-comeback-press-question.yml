name: Apply comeback press question

on: [push]

permissions: write-all

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Apply patch
        run: python3 .github/scripts/apply-comeback-press-question.py

      - name: Check patch
        run: git diff --check

      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/apply-comeback-press-question.yml
          git rm .github/scripts/apply-comeback-press-question.py
          git add app/career/press-conferences.ts
          git commit -m "feat: ask about comeback after man of the match"
          git push
