name: Materialize mobile badge fix

on:
  push:
    branches: [agent/futbobo-menu-tools-v93]

permissions:
  contents: write

jobs:
  materialize:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/futbobo-menu-tools-v93
          fetch-depth: 0
      - run: node scripts/agent-mobile-badge-fix.mjs
      - shell: bash
        run: |
          if git diff --quiet; then exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/components/career/PlayerCreationV2.module.css app/components/career/CareerTimeline.module.css
          git commit -m "fix: tighten mobile club badges"
          git push origin HEAD:agent/futbobo-menu-tools-v93
