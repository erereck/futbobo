name: Materialize v93 utility screens

on:
  push:
    branches: [agent/futbobo-menu-tools-v93]

permissions:
  contents: write

jobs:
  materialize:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/futbobo-menu-tools-v93
          fetch-depth: 0
      - run: node scripts/agent-shell-utilities-v93.mjs
      - shell: bash
        run: |
          if git diff --quiet; then exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/components/shell/FutboboShell.tsx
          git commit -m "feat: integrate native v93 utility screens"
          git push origin HEAD:agent/futbobo-menu-tools-v93
