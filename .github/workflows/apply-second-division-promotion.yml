name: Apply second division promotion patch

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/apply-second-division-promotion.yml"

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Patch promotion logic
        run: python scripts/apply-second-division-promotion.py

      - name: Check patch
        run: git diff --check

      - name: Commit promotion support
        run: |
          if git diff --quiet; then
            echo "Promotion patch already applied."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/career/simulation.ts
          git commit -m "feat: support promotion from new second divisions"
          git push
