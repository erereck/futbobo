name: Apply career mean temp

on:
  push:
    branches:
      - balance/career-ovr-production

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: balance/career-ovr-production
      - name: Apply final mean calibration
        run: python scripts/apply-career-balance-temp.py
      - name: Commit calibration
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/career/events.ts
          git commit -m "balance: center career peak OVR around 80"
          git push origin HEAD:balance/career-ovr-production
