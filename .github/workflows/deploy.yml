name: Publicar Futbobo no GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Um deploy por vez. Push novo espera o que está publicando terminar (e
# substitui os que estiverem só na fila), em vez de matar a publicação no meio.
concurrency:
  group: pages
  cancel-in-progress: false

# Gerar e publicar ficam em jobs separados: se o "Publicar" falhar por soluço
# do GitHub, "Re-run failed jobs" repete só a publicação com o mesmo artefato.
# Num job só, o re-run gerava um segundo artefato "github-pages" e o
# deploy-pages recusava ("Multiple artifacts named github-pages").
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Baixar o projeto
        uses: actions/checkout@v4
      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - name: Instalar dependências
        run: npm ci
      - name: Configurar Pages
        uses: actions/configure-pages@v5
      - name: Gerar site estático
        run: npm run build
        env:
          GITHUB_PAGES_CUSTOM_DOMAIN: "true"
      - name: Preparar artefato
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./out

  deploy:
    needs: build
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Publicar
        id: deployment
        uses: actions/deploy-pages@v4
