name: Apply loan performance buyout

on:
  push:
    branches:
      - feat/loan-performance-buyout
    paths:
      - .github/workflows/apply-loan-performance-buyout.yml
      - scripts/apply-loan-performance-buyout.py

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: feat/loan-performance-buyout
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Apply update
        run: python scripts/apply-loan-performance-buyout.py

      - name: Verify behavior source
        run: |
          grep -q 'averageRating <= 8.5' app/career/transfer-market.ts
          grep -q 'Compra após empréstimo' app/career/transfer-market.ts
          grep -q 'loanClubPermanentOffer(current)' app/components/career/CareerGame.tsx

      - name: Build
        run: npm run build

      - name: Remove temporary helpers
        run: rm .github/workflows/apply-loan-performance-buyout.yml scripts/apply-loan-performance-buyout.py

      - name: Commit update
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "feat: clube de empréstimo tenta compra após grande temporada"
          git push origin HEAD:feat/loan-performance-buyout
