name: Finish northern Europe assets

on:
  push:
    branches:
      - feat/northern-europe-leagues

permissions:
  contents: write

jobs:
  finish:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: feat/northern-europe-leagues
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Add explicit badge fallbacks
        run: node scripts/_finish-northern-europe.mjs

      - name: Sync remaining badges
        run: npm run sync:assets:missing

      - name: Restore pre-existing optimized assets
        run: |
          git fetch origin main
          git diff --name-only --diff-filter=M origin/main...HEAD -- public/assets \
            | grep -v '^public/assets/football-assets.json$' \
            > /tmp/preexisting-assets.txt || true
          if [ -s /tmp/preexisting-assets.txt ]; then
            while IFS= read -r file; do git checkout origin/main -- "$file"; done < /tmp/preexisting-assets.txt
          fi

      - name: Build final tree
        run: npm run build

      - name: Remove temporary helpers
        run: rm scripts/_finish-northern-europe.mjs .github/workflows/finish-northern-europe.yml

      - name: Commit final asset set
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --quiet && exit 0
          git commit -m "fix: completar escudos e preservar assets existentes"
          git push origin HEAD:feat/northern-europe-leagues
