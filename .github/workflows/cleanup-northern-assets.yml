name: Cleanup northern Europe asset diff

on:
  push:
    branches:
      - feat/northern-europe-leagues

permissions:
  contents: write

jobs:
  cleanup:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/northern-europe-leagues
          fetch-depth: 0
      - name: Restore every pre-existing binary asset
        run: |
          git fetch origin main
          git diff --name-only --diff-filter=M origin/main -- public/assets \
            | grep -v '^public/assets/football-assets.json$' \
            > /tmp/modified-assets.txt || true
          if [ -s /tmp/modified-assets.txt ]; then
            while IFS= read -r file; do git checkout origin/main -- "$file"; done < /tmp/modified-assets.txt
          fi
      - name: Remove temporary workflow
        run: rm .github/workflows/cleanup-northern-assets.yml
      - name: Commit clean diff
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --quiet && exit 0
          git commit -m "chore: manter somente os assets novos da expansão"
          git push origin HEAD:feat/northern-europe-leagues
