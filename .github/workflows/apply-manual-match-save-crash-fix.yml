name: Apply manual match save crash fix

on:
  push:
    branches:
      - fix/manual-match-save-crash
    paths:
      - scripts/apply-manual-match-save-crash-fix.py
      - .github/workflows/apply-manual-match-save-crash-fix.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: fix/manual-match-save-crash
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Apply fix
        run: python scripts/apply-manual-match-save-crash-fix.py

      - name: Verify source
        run: |
          grep -q 'compactGameForPersistence(game)' app/components/career/CareerGame.tsx
          grep -q 'const archivedMatchResult = compactBotaoMatchResult(matchResult)' app/components/career/CareerGame.tsx
          grep -q 'lastBotaoResult: { match, result: matchResult }' app/components/career/CareerGame.tsx
          ! grep -q '{ match, result: matchResult }]' app/components/career/CareerGame.tsx

      - name: Build
        run: npm run build

      - name: Remove temporary helpers
        run: rm scripts/apply-manual-match-save-crash-fix.py .github/workflows/apply-manual-match-save-crash-fix.yml

      - name: Commit fix
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/components/career/CareerGame.tsx app/career/save-compaction.ts scripts/apply-manual-match-save-crash-fix.py .github/workflows/apply-manual-match-save-crash-fix.yml
          git commit -m "fix: impedir crash ao salvar partidas manuais"
          git push origin HEAD:fix/manual-match-save-crash
