name: Ballon final QA

on:
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  test:
    if: github.head_ref == 'agent/ballon-final-calibration'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run production build and tests
        run: npm test

      - name: Run Ballon calibration batch
        run: npx --yes tsx@4 scripts/ballon-calibration.ts
