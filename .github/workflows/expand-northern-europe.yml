name: Expand northern Europe

on:
  push:
    branches:
      - feat/northern-europe-leagues

permissions:
  contents: write

jobs:
  expand:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: feat/northern-europe-leagues
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Apply league data
        run: node scripts/_apply-northern-europe.mjs

      - name: Sync missing football assets
        run: npm run sync:assets:missing

      - name: Build
        run: npm run build

      - name: Remove temporary expansion helpers
        run: rm scripts/_apply-northern-europe.mjs .github/workflows/expand-northern-europe.yml

      - name: Commit generated expansion
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --quiet && exit 0
          git commit -m "feat: adicionar seis ligas do norte e leste europeu"
          git push origin HEAD:feat/northern-europe-leagues
