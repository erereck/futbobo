name: Materialize Futbobo UX polish

on:
  push:
    branches:
      - agent/futbobo-ux-rework
  pull_request:
    branches:
      - main
    types:
      - ready_for_review

permissions:
  contents: write

jobs:
  polish:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: agent/futbobo-ux-rework
          fetch-depth: 0

      - name: Apply approved polish
        run: |
          node scripts/agent-ui-polish-safe.mjs
          node scripts/agent-ui-final-polish.mjs

      - name: Commit materialized UI
        shell: bash
        run: |
          if git diff --quiet; then
            echo "No materialization changes required."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- app/components/shell/FutboboShell.tsx app/components/shell/FutboboShell.module.css app/PlayerAppearanceEditor.tsx app/components/career/PlayerCreationV2.tsx app/components/career/PlayerCreationV2.module.css app/components/career/CareerReworkPanels.tsx app/components/career/CareerReworkPanels.module.css app/components/career/CareerExtraStats.module.css app/player-stories.ts app/career/events.ts app/player-appearance.ts
          git commit -m "polish: materialize approved Futbobo UX"
          git push origin HEAD:agent/futbobo-ux-rework
