name: Apply Futbobo UX polish

on:
  push:
    branches:
      - agent/futbobo-ux-rework

permissions:
  contents: write

jobs:
  polish:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: agent/futbobo-ux-rework
          fetch-depth: 0

      - name: Apply guarded polish
        run: node scripts/agent-ui-polish.mjs

      - name: Commit polish
        shell: bash
        run: |
          if git diff --quiet; then
            echo "No polish changes required."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- app/components/shell/FutboboShell.tsx app/components/shell/FutboboShell.module.css app/PlayerAppearanceEditor.tsx app/components/career/PlayerCreationV2.tsx app/components/career/PlayerCreationV2.module.css app/components/career/CareerReworkPanels.tsx app/components/career/CareerReworkPanels.module.css app/components/career/CareerExtraStats.module.css app/player-stories.ts app/career/events.ts app/player-appearance.ts
          git commit -m "polish: tighten responsive Futbobo UX"
          git push origin HEAD:agent/futbobo-ux-rework
