name: Validar mudanças no Futbobo

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Checar lint
        run: npm run lint
      - name: Testar compatibilidade dos personagens
        run: node --test tests/avatar-studio.test.mjs
      - name: Compilar o jogo completo
        run: npm run build
