name: Increase two-year loan offers

on:
  push:
    paths:
      - '.github/workflows/increase-two-year-loans.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Increase two-year loan probability
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('app/career/transfer-market.ts')
          text = path.read_text()
          old = '''function materializeOffer(state: GameState, club: Club, context: MarketContext, salt: number): TransferOffer {
  const role = candidateRole(state, club);
  const contract = createContract(state.overall, state.age, club, state.seed + state.season * 97 + salt + CLUBS.indexOf(club));
  const reason = offerReason(state, club, role, context);
  const parentShare = context.mode === "loan" ? clamp(Math.round((44 + (competitiveStrength(club) - competitiveStrength(context.sourceClub)) * 2) / 5) * 5, 20, 75) : 0;
  return {
    id: `${state.season}-${context.sourceClub.id}-${club.id}-${context.mode}`, clubId: club.id,
    fromClubId: context.sourceClub.id, season: state.season, type: context.mode, role,
    reason: reason.reason, reasonLabel: reason.label, reasonText: reason.text,
    transferFee: actualTransferFee(state, club, context, role, salt),
    annualSalary: context.mode === "loan" ? state.annualSalary : contract.annualSalary,
    contractYears: context.mode === "loan" ? state.contractYears : contract.years,
    loanEndSeason: context.mode === "loan" ? state.season + 1 : 0,
    parentSalaryShare: parentShare, destinationSalaryShare: context.mode === "loan" ? 100 - parentShare : 100,
    expiresSeason: state.season + 1,
  };
}'''
          new = '''function materializeOffer(state: GameState, club: Club, context: MarketContext, salt: number): TransferOffer {
  const role = candidateRole(state, club);
  const contract = createContract(state.overall, state.age, club, state.seed + state.season * 97 + salt + CLUBS.indexOf(club));
  const reason = offerReason(state, club, role, context);
  const parentShare = context.mode === "loan" ? clamp(Math.round((44 + (competitiveStrength(club) - competitiveStrength(context.sourceClub)) * 2) / 5) * 5, 20, 75) : 0;
  // Empréstimos longos agora são uma possibilidade real. Clubes apostam mais
  // em dois anos quando o jogador ainda está em fase forte de desenvolvimento.
  const twoYearLoanChance = context.mode === "loan"
    ? clamp(0.38 + (state.age <= 20 ? 0.16 : state.age <= 23 ? 0.08 : 0) + (context.trigger === "youth-development" ? 0.08 : 0), 0, 0.62)
    : 0;
  const loanYears = context.mode === "loan" && seeded(state.seed, state.season * 1301 + salt + CLUBS.indexOf(club) * 17) < twoYearLoanChance ? 2 : 1;
  return {
    id: `${state.season}-${context.sourceClub.id}-${club.id}-${context.mode}`, clubId: club.id,
    fromClubId: context.sourceClub.id, season: state.season, type: context.mode, role,
    reason: reason.reason, reasonLabel: reason.label,
    reasonText: context.mode === "loan" ? `${reason.text} Empréstimo de ${loanYears} temporada${loanYears > 1 ? "s" : ""}.` : reason.text,
    transferFee: actualTransferFee(state, club, context, role, salt),
    annualSalary: context.mode === "loan" ? state.annualSalary : contract.annualSalary,
    contractYears: context.mode === "loan" ? state.contractYears : contract.years,
    loanEndSeason: context.mode === "loan" ? state.season + loanYears : 0,
    parentSalaryShare: parentShare, destinationSalaryShare: context.mode === "loan" ? 100 - parentShare : 100,
    expiresSeason: state.season + 1,
  };
}'''
          if old not in text:
              raise SystemExit('target materializeOffer block not found')
          path.write_text(text.replace(old, new, 1))
          PY
          git diff --check

      - name: Install dependencies
        run: npm ci

      - name: Build Futbobo
        run: npm run build

      - name: Commit feature and remove helper
        run: |
          rm .github/workflows/increase-two-year-loans.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/career/transfer-market.ts .github/workflows/increase-two-year-loans.yml
          git commit -m "feat: increase two-year loan offers"
          git push
