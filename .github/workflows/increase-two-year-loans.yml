name: Increase two-year loan offers

on:
  push:
    paths:
      - '.github/workflows/increase-two-year-loans.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Increase two-year loan probability
        run: |
          python -c 'from pathlib import Path; p=Path("app/career/transfer-market.ts"); s=p.read_text(); old="loanEndSeason: context.mode === \"loan\" ? state.season + 1 : 0,"; new="loanEndSeason: context.mode === \"loan\" ? state.season + (seeded(state.seed, state.season * 1301 + salt + CLUBS.indexOf(club) * 17) < 0.5 ? 2 : 1) : 0,"; assert old in s, "loan duration target not found"; p.write_text(s.replace(old,new,1))'
          git diff --check

      - name: Install dependencies
        run: npm ci

      - name: Build Futbobo
        run: npm run build

      - name: Commit feature and remove helper
        run: |
          rm .github/workflows/increase-two-year-loans.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/career/transfer-market.ts .github/workflows/increase-two-year-loans.yml
          git commit -m "feat: increase two-year loan offers"
          git push
