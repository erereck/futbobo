name: Materialize living World Players

on:
  push:
    branches: [agent/futbobo-world-players-live-world]

permissions:
  contents: write

jobs:
  materialize:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/futbobo-world-players-live-world
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22.13.0
          cache: npm
      - run: node scripts/agent-worldplayers-live-world.mjs
      - run: npm ci
      - run: npm test
      - run: npm run lint
      - shell: bash
        run: |
          if git diff --quiet; then exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/career/official-football-records.ts app/career/world-memory.ts app/components/career/CareerWorld.tsx
          git commit -m "feat: bring persistent players into Mundo"
          git push origin HEAD:agent/futbobo-world-players-live-world
