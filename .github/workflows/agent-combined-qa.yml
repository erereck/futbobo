name: Combined World Players + Prestige QA

on:
  push:
    branches: [agent/futbobo-prestige-legacy-records]

permissions:
  contents: write

jobs:
  qa:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/futbobo-prestige-legacy-records
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22.13.0
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run lint
      - shell: bash
        run: |
          printf 'combined QA passed for %s\n' "$(git rev-parse HEAD)" > .agent-combined-qa-ok
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .agent-combined-qa-ok
          git commit -m "chore: combined integration QA passed"
          git push origin HEAD:agent/futbobo-prestige-legacy-records
