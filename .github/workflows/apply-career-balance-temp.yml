name: Apply career balance temp

on:
  push:
    branches:
      - balance/career-ovr-production

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: balance/career-ovr-production
      - name: Apply balance patch
        run: python scripts/apply-career-balance-temp.py
      - name: Commit patch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/career/events.ts app/career/simulation.ts
          git commit -m "balance: recalibrate career OVR and production"
          git push origin HEAD:balance/career-ovr-production
