name: Fix seven-second pause copy

"on":
  push:
    branches: [main]
    paths:
      - .github/workflows/fix-seven-second-pause-copy.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Update pause copy
        run: |
          python3 - <<'PY'
          from pathlib import Path
          path = Path("app/botao/BotaoMatch.tsx")
          text = path.read_text()
          old = '<p>{localMatch ? "Relógio e bola estão congelados." : "Relógio, adversário e bola estão congelados."}</p>'
          new = '<p>{localMatch ? "Relógio e bola estão congelados." : "Relógio da partida, bola e adversário congelam. A regra dos 7s continua."}</p>'
          if old not in text:
              raise SystemExit("pause copy anchor not found")
          path.write_text(text.replace(old, new, 1).rstrip() + "\n")
          PY

      - name: Validate diff
        run: git diff --check

      - name: Install dependencies
        run: npm ci

      - name: Build Futbobo
        run: npm run build

      - name: Commit and clean helper
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/botao/BotaoMatch.tsx
          git rm .github/workflows/fix-seven-second-pause-copy.yml
          git commit -m "fix: explain seven-second rule during pause"
          git push
