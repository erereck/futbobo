name: Fix last two northern Europe badges

on:
  push:
    branches:
      - feat/northern-europe-leagues

permissions:
  contents: write

jobs:
  fix:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/northern-europe-leagues
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Patch final badge sources
        run: node scripts/_fix-last-two-badges.mjs
      - name: Sync missing assets
        run: npm run sync:assets:missing
      - name: Restore pre-existing assets touched by optimizer
        run: |
          git fetch origin main
          git diff --name-only --diff-filter=M origin/main...HEAD -- public/assets \
            | grep -v '^public/assets/football-assets.json$' \
            > /tmp/preexisting-assets.txt || true
          if [ -s /tmp/preexisting-assets.txt ]; then
            while IFS= read -r file; do git checkout origin/main -- "$file"; done < /tmp/preexisting-assets.txt
          fi
      - name: Verify final badges
        run: |
          test -s public/assets/clubs/wisla-plock.png
          test -s public/assets/clubs/lokomotiva-zagreb.png
          grep -q '"wisla-plock"' app/verified-club-assets.ts
          grep -q '"lokomotiva-zagreb"' app/verified-club-assets.ts
      - name: Build
        run: npm run build
      - name: Remove temporary helpers
        run: rm scripts/_fix-last-two-badges.mjs .github/workflows/fix-last-two-badges.yml
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --quiet && exit 0
          git commit -m "fix: completar cobertura dos escudos europeus"
          git push origin HEAD:feat/northern-europe-leagues
