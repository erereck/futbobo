name: Apply last-shot grace and anti-stall

"on":
  push:
    branches: [main]
    paths:
      - .github/workflows/apply-last-shot-and-inactivity.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Apply feature patch
        run: python3 scripts/apply-last-shot-and-inactivity.py

      - name: Normalize generated files
        run: |
          python3 - <<'PY'
          from pathlib import Path
          for name in ["app/botao/engine.ts", "app/botao/BotaoMatch.tsx", "app/botao/botao.css"]:
              path = Path(name)
              path.write_text(path.read_text().rstrip() + "\n")
          PY

      - name: Validate diff
        run: git diff --check

      - name: Install dependencies
        run: npm ci

      - name: Build Futbobo
        run: npm run build

      - name: Commit feature and remove helpers
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/botao/engine.ts app/botao/BotaoMatch.tsx app/botao/botao.css
          git rm scripts/apply-last-shot-and-inactivity.py .github/workflows/apply-last-shot-and-inactivity.yml
          git commit -m "feat: add miraculous last-shot grace and anti-stall timer"
          git push
