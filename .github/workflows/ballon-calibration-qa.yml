name: Ballon calibration QA

on:
  pull_request:
    branches:
      - main

permissions:
  contents: write

jobs:
  calibrate:
    if: github.head_ref == 'agent/ballon-final-calibration'
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Checkout PR branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Materialize exact Brasileirão rule
        run: node scripts/materialize-brazil-ballon.mjs

      - name: Commit materialized production wiring
        run: |
          if git diff --quiet; then
            echo "Nothing to materialize."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/career/simulation.ts
          git commit -m "balance: exigir Copa do Brasil na candidatura brasileira"
          git push origin HEAD:${{ github.head_ref }}

      - name: Run Ballon calibration
        run: npx --yes tsx@4 scripts/ballon-calibration.ts
