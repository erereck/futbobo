name: Validate Futbobo UX branch

on:
  push:
    branches:
      - agent/futbobo-ux-rework

permissions:
  contents: write

jobs:
  build:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/futbobo-ux-rework
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22.13.0
          cache: npm
      - run: npm ci
      - name: Build and capture diagnostics
        shell: bash
        run: |
          set +e
          npm run build > /tmp/futbobo-build.log 2>&1
          status=$?
          set -e
          if [ "$status" -ne 0 ]; then
            tail -n 240 /tmp/futbobo-build.log > .agent-build-error.log
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add -- .agent-build-error.log
            git commit -m "ci: capture UX branch build failure" || true
            git push origin HEAD:agent/futbobo-ux-rework
            cat /tmp/futbobo-build.log
            exit "$status"
          fi
          rm -f .agent-build-error.log
          echo "BUILD_OK" > .agent-build-ok
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- .agent-build-ok .agent-build-error.log
          git commit -m "ci: confirm UX branch build" || true
          git push origin HEAD:agent/futbobo-ux-rework
