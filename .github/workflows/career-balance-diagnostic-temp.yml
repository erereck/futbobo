name: Career balance diagnostic temp

on:
  push:
    branches:
      - balance/career-ovr-production

permissions:
  contents: read

jobs:
  diagnostic:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Run diagnostic
        run: npx --yes tsx scripts/career-balance-diagnostic-temp.ts
