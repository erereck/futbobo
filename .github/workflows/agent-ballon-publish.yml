name: Agent Ballon publish

on:
  push:
    branches:
      - agent/ballon-dor-balance

permissions:
  contents: write

jobs:
  integrate-test-clean:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: agent/ballon-dor-balance
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22.13.0
          cache: npm

      - name: Install
        run: npm ci

      - name: Apply clean Ballon integration
        run: node scripts/apply-ballon-dor-balance.mjs

      - name: Test full project
        run: npm test

      - name: Commit final tree and remove helpers
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/career/simulation.ts tests/rendered-html.test.mjs
          git rm scripts/apply-ballon-dor-balance.mjs .github/workflows/agent-ballon-publish.yml
          git commit -m "balance: wire and validate Ballon d'Or calibration"
          git push origin HEAD:agent/ballon-dor-balance
