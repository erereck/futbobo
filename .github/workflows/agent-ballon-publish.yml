name: Agent Ballon publish

on:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  integrate-clean:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Apply clean Ballon integration
        run: node scripts/apply-ballon-dor-balance.mjs

      - name: Commit final tree and remove helpers
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/career/simulation.ts tests/rendered-html.test.mjs
          git rm scripts/apply-ballon-dor-balance.mjs .github/workflows/agent-ballon-publish.yml
          git commit -m "balance: wire Ballon d'Or calibration"
          git push origin HEAD:main
