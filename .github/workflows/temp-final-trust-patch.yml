name: Temporary final trust patch

on:
  push:
    branches:
      - fix/final-manager-trust-boost

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/final-manager-trust-boost
      - name: Apply focused CareerGame patch
        shell: bash
        run: |
          echo '' | base64 -d > /tmp/apply_patch.py
          python /tmp/apply_patch.py
      - name: Commit patch
        shell: bash
        run: |
          if git diff --quiet; then
            echo "No changes needed"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/components/career/CareerGame.tsx
          git commit -m "feat: boost manager trust after decisive finals"
          git push origin HEAD:fix/final-manager-trust-boost
