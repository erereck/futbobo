name: Ballon d'Or title-gated QA

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  qa:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Production build and TypeScript
        run: npm run build
      - name: Ballon d'Or scenarios and Monte Carlo
        run: npx --yes tsx scripts/ballon-title-qa.ts
        env:
          BALLON_MC_RUNS: "3000"
