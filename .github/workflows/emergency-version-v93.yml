name: Emergency Futbobo v93 bump

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  bump-version:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - name: Bump footer version
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('app/components/shell/FutboboShell.tsx')
          text = path.read_text(encoding='utf-8')
          old = '<strong>v92 · DONO DA ÁREA</strong>'
          new = '<strong>v93 · DONO DA ÁREA</strong>'
          if old not in text:
              raise SystemExit('v92 footer marker not found')
          if text.count(old) != 1:
              raise SystemExit('v92 footer marker is ambiguous')
          path.write_text(text.replace(old, new), encoding='utf-8')
          PY
      - name: Commit v93
        shell: bash
        run: |
          if git diff --quiet; then exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/components/shell/FutboboShell.tsx
          git commit -m "chore: bump Futbobo to v93"
          git push origin HEAD:main
