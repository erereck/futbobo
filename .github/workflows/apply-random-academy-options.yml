name: Apply random academy options

on:
  push:
    branches: [feat/random-academy-club-options]

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: feat/random-academy-club-options
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Apply academy selection update
        run: node scripts/_apply-random-academy-options.mjs

      - name: Build
        run: npm run build

      - name: Remove temporary helpers
        run: rm scripts/_apply-random-academy-options.mjs .github/workflows/apply-random-academy-options.yml

      - name: Commit update
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --quiet && exit 0
          git commit -m "feat: sortear opções iniciais da base"
          git push origin HEAD:feat/random-academy-club-options
