name: Materialize prestige legacy integration

on:
  push:
    branches: [agent/futbobo-prestige-legacy-records]

permissions:
  contents: write

jobs:
  materialize:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/futbobo-prestige-legacy-records
          fetch-depth: 0
      - run: node scripts/agent-prestige-careergame.mjs
      - shell: bash
        run: |
          if git diff --quiet; then exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/components/career/CareerGame.tsx
          git commit -m "feat: apply prestige-aware legacy score"
          git push origin HEAD:agent/futbobo-prestige-legacy-records
