name: Apply regional low OVR market

on:
  push:
    branches: [feat/regional-low-ovr-market]
    paths: [.github/workflows/apply-regional-low-ovr-market.yml]

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: feat/regional-low-ovr-market
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Apply regional market update
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('app/career/transfer-market.ts')
          lines = path.read_text().splitlines()
          start = next(i for i, line in enumerate(lines) if 'const priorityCountryId = options.forceDomestic' in line)
          end = next(i for i, line in enumerate(lines[start:], start) if 'let loanId = "";' in line)
          replacement = [
              '  const priorityCountryId = options.forceDomestic ? (options.domesticCountryId ?? context.sourceClub.countryId) : context.sourceClub.countryId;',
              '  const sourceConfederation = clubConfederation(context.sourceClub);',
              '  const lowOverallRegionalMarket =',
              '    state.overall < 74 &&',
              '    (sourceConfederation === "SOUTH_AMERICA" || sourceConfederation === "EUROPE") &&',
              '    !options.forceDomestic &&',
              '    !options.forceForeign;',
              '  const domesticLimit = lowOverallRegionalMarket',
              '    ? Math.min(2, Math.max(1, Math.floor(wanted / 3)))',
              '    : context.careerPhase === "veteran" ? 4 : 3;',
              '  const domestic = pool.filter((club) => club.countryId === priorityCountryId).slice(0, domesticLimit);',
              '  const regionalStrengthCeiling = Math.max(sourceConfederation === "EUROPE" ? 79 : 77, state.overall + 6);',
              '  const regionalForeign = lowOverallRegionalMarket',
              '    ? pool.filter((club) =>',
              '        club.countryId !== priorityCountryId &&',
              '        clubConfederation(club) === sourceConfederation &&',
              '        competitiveStrength(club) <= regionalStrengthCeiling,',
              '      )',
              '    : [];',
              '  const rest = pool.filter((club) => !domestic.includes(club) && !regionalForeign.includes(club));',
              '  let selected = Array.from(new Set([',
              '    ...domestic,',
              '    ...regionalForeign,',
              '    ...rest,',
              '  ])).slice(0, wanted);',
              '  if (options.forceForeign) selected = rest.filter(isEuropeanClub).slice(0, wanted);',
              '  if (options.forceDomestic) selected = domestic.slice(0, wanted);',
          ]
          path.write_text('\n'.join(lines[:start] + replacement + lines[end:]) + '\n')
          PY

      - name: Verify behavior source
        run: |
          grep -q 'state.overall < 74' app/career/transfer-market.ts
          grep -q 'sourceConfederation === "SOUTH_AMERICA"' app/career/transfer-market.ts
          grep -q 'sourceConfederation === "EUROPE"' app/career/transfer-market.ts
          grep -q 'regionalForeign' app/career/transfer-market.ts

      - name: Build
        run: npm run build

      - name: Remove temporary workflow
        run: rm .github/workflows/apply-regional-low-ovr-market.yml

      - name: Commit update
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/career/transfer-market.ts .github/workflows/apply-regional-low-ovr-market.yml
          git commit -m "feat: ampliar mercado regional para jogadores sub-74"
          git push origin HEAD:feat/regional-low-ovr-market
