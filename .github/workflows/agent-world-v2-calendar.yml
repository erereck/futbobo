name: Materialize Futbobo World V2 calendar

on:
  push:
    branches:
      - agent/futbobo-world-memory

permissions:
  contents: write

jobs:
  materialize:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/futbobo-world-memory
          fetch-depth: 0
      - name: Apply guarded calendar changes
        run: node scripts/agent-world-v2-calendar.mjs
      - name: Commit product changes
        shell: bash
        run: |
          if git diff --quiet; then
            echo "No changes required."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- app/components/career/CareerGame.tsx app/career/world-memory.ts
          git commit -m "feat: start careers in 2027 and simulate 2030 World Cup"
          git push origin HEAD:agent/futbobo-world-memory
