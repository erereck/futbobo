name: Materialize Futbobo World update

on:
  pull_request:
    branches:
      - main
    types:
      - ready_for_review

permissions:
  contents: write

jobs:
  materialize:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/futbobo-world-memory
          fetch-depth: 0
      - name: Apply guarded World integration
        run: node scripts/agent-world-memory.mjs
      - name: Commit product integration
        shell: bash
        run: |
          if git diff --quiet; then
            echo "No materialization changes required."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- app/components/career/CareerGame.tsx app/components/career/CareerReworkPanels.tsx app/components/shell/FutboboShell.module.css app/globals.css
          git commit -m "feat: integrate World, memory and history UI"
          git push origin HEAD:agent/futbobo-world-memory
