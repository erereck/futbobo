name: Final living world v93 QA 2

on:
  push:
    branches: [agent/futbobo-world-players-live-world]

permissions:
  contents: write

jobs:
  qa:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/futbobo-world-players-live-world
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22.13.0
          cache: npm
      - run: node scripts/agent-finalize-world-v93.mjs
      - run: npm ci
      - name: Test + lint
        shell: bash
        run: |
          set +e
          npm test > /tmp/test.log 2>&1
          TEST_CODE=$?
          npm run lint > /tmp/lint.log 2>&1
          LINT_CODE=$?
          set -e
          {
            echo "test=$TEST_CODE"
            echo "lint=$LINT_CODE"
            echo "commit=$(git rev-parse HEAD)"
            echo "--- failing test context ---"
            grep -n -B 12 -A 28 "not ok" /tmp/test.log || true
            echo "--- test tail ---"
            tail -n 45 /tmp/test.log
            echo "--- lint tail ---"
            tail -n 30 /tmp/lint.log
          } > .agent-world-v93-qa2
      - name: Commit materialized product and result
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/career/simulation.ts app/career/world-memory.ts .agent-world-v93-qa2
          git commit -m "chore: materialize and verify final living world" || true
          git push origin HEAD:agent/futbobo-world-players-live-world
