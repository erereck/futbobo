name: Publicar APK Android

on:
  push:
    tags:
      - "android-v*"
  workflow_dispatch:
    inputs:
      release_tag:
        description: Tag Android que receberá o APK
        required: true
        default: android-v1.3.0

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    env:
      RELEASE_TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.release_tag || github.ref_name }}
    steps:
      - name: Baixar o projeto
        uses: actions/checkout@v4

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Configurar Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: gradle

      - name: Instalar dependências
        run: npm ci

      - name: Restaurar assinatura Android
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_STORE_PASSWORD: ${{ secrets.ANDROID_STORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          test -n "$ANDROID_KEYSTORE_BASE64"
          mkdir -p .android-signing
          printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 --decode > .android-signing/futbobo-release.p12
          printf 'storeFile=../.android-signing/futbobo-release.p12\nstorePassword=%s\nkeyAlias=%s\nkeyPassword=%s\n' \
            "$ANDROID_STORE_PASSWORD" "$ANDROID_KEY_ALIAS" "$ANDROID_KEY_PASSWORD" \
            > .android-signing/keystore.properties

      - name: Gerar APK assinado
        run: |
          npm run android:prepare
          chmod +x android/gradlew
          cd android
          ./gradlew assembleRelease

      - name: Preparar release
        id: release_meta
        shell: bash
        run: |
          VERSION=$(node -p "require('./package.json').version")
          # A tag precisa bater com a versão do package.json: o app compara as duas para avisar da atualização.
          test "$RELEASE_TAG" = "android-v${VERSION}"
          # O aviso do app e o link "latest/download/futbobo.apk" do site procuram este nome exato.
          APK="futbobo.apk"
          cp android/app/build/outputs/apk/release/app-release.apk "$APK"
          sha256sum "$APK" > "${APK}.sha256"
          echo "apk=$APK" >> "$GITHUB_OUTPUT"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Publicar no GitHub Releases
        env:
          GH_TOKEN: ${{ github.token }}
          APK: ${{ steps.release_meta.outputs.apk }}
          VERSION: ${{ steps.release_meta.outputs.version }}
        run: |
          gh release create "$RELEASE_TAG" "$APK" "${APK}.sha256" \
            --title "Futbobo Android ${VERSION}" \
            --notes "Bobonline: futebol de botão online com amigos, em X1 ou torneio de 4 e 8, com conexão mais resistente. Modo 3D com bonecos animados e comemorações novas. Scorebobo com 12 fases e a base jogável na carreira. Build assinado, offline, gerado do commit ${GITHUB_SHA}." \
            --latest
