name: Fix loan duration and stale club events

on:
  push:
    paths:
      - '.github/workflows/fix-loan-duration-and-stale-events.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Patch loan duration labels and stale events
        run: |
          python - <<'PY'
          from pathlib import Path
          market = Path('app/components/career/TransferMarketScreen.tsx')
          text = market.read_text()
          old = '  if (state.pendingTransferMode === "loan") return { eyebrow: "EMPRÉSTIMO", title: "Minutos em outro clube", text: `Você retorna ao ${currentClub.shortName} ao fim da próxima temporada.` };'
          new = '  if (state.pendingTransferMode === "loan") return { eyebrow: "EMPRÉSTIMO", title: "Minutos em outro clube", text: `A duração varia por proposta. Ao fim do empréstimo, você retorna ao ${currentClub.shortName}.` };'
          if old not in text: raise SystemExit('loan window copy not found')
          text = text.replace(old, new, 1)
          old = '  if (offer.type === "loan") return "Empréstimo · 1 temporada";'
          new = '  if (offer.type === "loan") { const seasons = Math.max(1, (offer.loanEndSeason || offer.season + 1) - offer.season); return `Empréstimo · ${seasons} temporada${seasons === 1 ? "" : "s"}`; }'
          if old not in text: raise SystemExit('loan market label not found')
          text = text.replace(old, new, 1)
          old = '<small>{offer.type === "loan" ? "1 temporada" : `${offer.contractYears} ano${offer.contractYears === 1 ? "" : "s"} de contrato`}</small>'
          new = '<small>{offer.type === "loan" ? `${Math.max(1, (offer.loanEndSeason || offer.season + 1) - offer.season)} temporada${Math.max(1, (offer.loanEndSeason || offer.season + 1) - offer.season) === 1 ? "" : "s"}` : `${offer.contractYears} ano${offer.contractYears === 1 ? "" : "s"} de contrato`}</small>'
          if old not in text: raise SystemExit('loan journey label not found')
          market.write_text(text.replace(old, new, 1))
          career = Path('app/components/career/CareerGame.tsx')
          text = career.read_text()
          old = '        currentEventId: pendingCareerEventId || selectNextEvent(transferred, current.season * 47),'
          new = '        currentEventId: newClub ? selectNextEvent(transferred, current.season * 47) : (pendingCareerEventId || selectNextEvent(transferred, current.season * 47)),'
          if old not in text: raise SystemExit('stale transfer event assignment not found')
          career.write_text(text.replace(old, new, 1))
          PY
          git diff --check

      - name: Install dependencies
        run: npm ci

      - name: Build Futbobo
        run: npm run build

      - name: Commit fixes and clean helper
        run: |
          rm .github/workflows/fix-loan-duration-and-stale-events.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/components/career/TransferMarketScreen.tsx app/components/career/CareerGame.tsx .github/workflows/fix-loan-duration-and-stale-events.yml
          git commit -m "fix: show real loan duration and refresh club events"
          git push
